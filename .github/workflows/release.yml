name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs. Actions are pinned to commit SHAs (Dependabot bumps them).
permissions: {}

jobs:
  # Sees the signing secrets, but can only read the repository.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $tag is not vX.Y.Z" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          TIVIBRO_KEYSTORE_BASE64: ${{ secrets.TIVIBRO_KEYSTORE_BASE64 }}
          TIVIBRO_KEYSTORE_PASSWORD: ${{ secrets.TIVIBRO_KEYSTORE_PASSWORD }}
          TIVIBRO_KEY_ALIAS: ${{ secrets.TIVIBRO_KEY_ALIAS }}
          TIVIBRO_KEY_PASSWORD: ${{ secrets.TIVIBRO_KEY_PASSWORD }}
        run: |
          for v in TIVIBRO_KEYSTORE_BASE64 TIVIBRO_KEYSTORE_PASSWORD TIVIBRO_KEY_ALIAS TIVIBRO_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Secret $v is missing: refusing to publish a debug-signed APK" >&2; exit 1; fi
          done

      - name: Build and test
        env:
          TIVIBRO_KEYSTORE_BASE64: ${{ secrets.TIVIBRO_KEYSTORE_BASE64 }}
          TIVIBRO_KEYSTORE_PASSWORD: ${{ secrets.TIVIBRO_KEYSTORE_PASSWORD }}
          TIVIBRO_KEY_ALIAS: ${{ secrets.TIVIBRO_KEY_ALIAS }}
          TIVIBRO_KEY_PASSWORD: ${{ secrets.TIVIBRO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PtivibroVersion=${{ steps.version.outputs.version }}

      - name: Rename the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TiViBro-${GITHUB_REF_NAME}.apk"
          rm -rf app/build/signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

  # Can write releases, but never sees the signing secrets.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/TiViBro-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
